# 送るたびに、エージェントが手伝うチェック（段階1）
# 🦉 フクロウ：合言葉の書きこみを見る（1-2）／🐱 ヤマネコ：テスト（1-1）
# エージェントは「見る・知らせる」まで。マージを決めるのは人。止め方は .github/agents/README.md
name: テスト

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  owl:
    name: フクロウの安全チェック
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/agents/owl-check.mjs

  test:
    name: test (${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: テスト
        shell: bash
        run: npm test 2>&1 | tee test-output.txt
